version: 2

models:
  - name: monthly_revenue_waterfall
    description: "Monthly MRR waterfall showing how recurring revenue changes by movement type."
    columns:
      - name: month_id
        description: "Calendar month of the MRR movement, represented as the first day of the month."
        data_tests:
          - not_null
      - name: movement_type
        data_tests:
          - not_null
        description: "MRR movement category."
      - name: account_count
        description: "Number of distinct accounts contributing to the movement type."
      - name: mrr_movement
        description: "Total MRR amount associated with the movement_type."
      - name: mrr_change_amount
        description: "Actual MRR change amount used for waterfall."
      - name: starting_mrr
        description: "Total account MRR at the beginning of the month, based on previous month MRR."
      - name: ending_mrr
        description: "Total account MRR at the end of the month, based on current month MRR."
      - name: total_account_mrr_movement
        description: "Net account-level MRR change for the month, calculated as ending MRR minus starting MRR."
      - name: churn_event_count
        description: "Number of churn events associated with churn movement rows in the month."
      - name: refund_amount_usd
        description: "Total refund amount ins USD associated with churn events. Refunds are shown as context and are not included in MRR change calculations."